<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K4 · Discord Digest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="workspace" class="workspace">
  <aside class="navigation" aria-label="Điều hướng">
    <header class="brand"><div class="brand-mark" aria-hidden="true">K4</div><div><strong>Discord Digest</strong><small>Không gian học tập K4</small></div><button id="closeNavigation" class="icon-btn mobile-only" aria-label="Đóng điều hướng" title="Đóng">×</button></header>
    <label class="field-label" for="guildSelect">SERVER</label>
    <select id="guildSelect" aria-label="Chọn server"></select>
    <div id="guildStats" class="nav-caption"></div>
    <nav class="view-navigation">
      <button id="assistantView" class="nav-item"><span aria-hidden="true">✦</span>Trợ lý tra cứu</button>
      <button id="reportsView" class="nav-item"><span aria-hidden="true">▤</span>Bản tin của bot<span id="reportCount" class="nav-count"></span></button>
    </nav>
    <div class="nav-section-title"><span>KÊNH ĐÃ THU THẬP</span><span id="channelCount"></span></div>
    <nav id="channelList" class="channel-list" aria-label="Kênh"></nav>
    <footer class="nav-footer"><span class="status-dot"></span><div><strong>Bản lưu đã ẩn danh</strong><small id="archiveRange"></small></div></footer>
  </aside>

  <main class="main">
    <header class="main-header">
      <button id="openNavigation" class="icon-btn mobile-only" aria-label="Mở điều hướng" title="Điều hướng">☰</button>
      <div class="heading"><div class="breadcrumb" id="breadcrumb">DISCORD K4</div><h1 id="viewTitle">Đang tải dữ liệu...</h1></div>
      <span id="viewMeta" class="header-meta"></span>
      <button id="openPins" class="icon-btn pins-toggle" aria-label="Tin đã ghim" title="Tin đã ghim" aria-controls="pinsPanel" aria-expanded="true"><span aria-hidden="true">📌</span><span id="pinCount">0</span></button>
    </header>
    <section id="archiveToolbar" class="archive-toolbar" aria-label="Bộ lọc tin nhắn">
      <div class="search-field"><span aria-hidden="true">⌕</span><input id="messageSearch" type="search" aria-label="Tìm trong kênh" placeholder="Tìm nội dung, mã tin, tác giả..." /></div>
      <div class="filter-row">
        <select id="dateFilter" aria-label="Ngày gửi"><option value="">Tất cả ngày</option></select>
        <select id="authorFilter" aria-label="Loại tác giả"><option value="">Mọi tác giả</option><option value="human">Người viết</option><option value="bot">Bot</option></select>
        <select id="topicFilter" aria-label="Chủ đề"><option value="">Mọi chủ đề</option></select>
        <button id="clearFilters" class="icon-btn" aria-label="Xóa bộ lọc" title="Xóa bộ lọc">↺</button>
      </div>
    </section>
    <div id="resultBar" class="result-bar"><span id="resultCount"></span><span>UTC+7</span></div>
    <section id="messagesViewport" class="messages-viewport" aria-label="Nội dung kênh"><p class="empty-state">Đang đọc Discord pack...</p></section>
    <section class="composer-area">
      <div class="composer-context"><label for="askScope">Phạm vi tra cứu</label><select id="askScope"><option value="channel">Kênh hiện tại</option><option value="guild">Server hiện tại</option><option value="all">Toàn bộ pack</option></select><span id="providerStatus"></span></div>
      <form id="questionForm" class="composer"><input id="composerInput" maxlength="3000" aria-label="Câu hỏi cho trợ lý" placeholder="Hỏi về deadline, điểm danh, ghép đội..." autocomplete="off" required /><button id="sendMessage" class="send-btn" type="submit" aria-label="Gửi câu hỏi" title="Gửi câu hỏi">↑</button></form>
    </section>
  </main>

  <aside id="pinsPanel" class="pins-panel" aria-label="Thông tin cần theo dõi">
    <header class="panel-heading"><div><small>THEO DÕI</small><h2>Thông tin quan trọng</h2></div><button id="closePins" class="icon-btn" aria-label="Đóng bảng ghim" title="Đóng">×</button></header>
    <div class="pins-tabs" role="tablist" aria-label="Loại thông tin"><button id="savedTab" role="tab" aria-selected="true" aria-controls="pinsList" class="active">Đã ghim <span id="savedCount">0</span></button><button id="importantTab" role="tab" aria-selected="false" aria-controls="pinsList">Quan trọng <span id="importantCount">0</span></button></div>
    <div class="pins-filters"><input id="pinSearch" type="search" placeholder="Tìm tin đã lưu..." aria-label="Tìm thông tin đã lưu" /><select id="pinChannel" aria-label="Lọc kênh đã ghim"><option value="">Tất cả server / kênh</option></select></div>
    <div class="analysis-status"><span id="analysisStatus">Phân loại cục bộ</span><button id="refreshImportance" class="text-btn" title="Phân tích tối đa 30 tin đang hiển thị">Phân tích AI</button></div>
    <div id="pinsList" class="pins-list" role="tabpanel" aria-labelledby="savedTab"></div>
    <footer class="panel-footer">Ghim được lưu trên trình duyệt này.</footer>
  </aside>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
